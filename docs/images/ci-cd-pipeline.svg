<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img">
<title>SiteLog CI and CD pipeline</title>
<desc>CI on every PR: guards and lint in parallel, then strict build, then fastlane test. CD on a v tag: fastlane beta to TestFlight. fastlane release is run by hand.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .frame { fill: none; stroke: #888780; stroke-dasharray: 4 4; }
  .label { fill: #5F5E5A; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  @media (prefers-color-scheme: dark) {
    .gray rect { fill: #444441; stroke: #B4B2A9; }
    .gray .th { fill: #F1EFE8; } .gray .ts { fill: #D3D1C7; }
    .teal rect { fill: #085041; stroke: #5DCAA5; }
    .teal .th { fill: #E1F5EE; } .teal .ts { fill: #9FE1CB; }
    .purple rect { fill: #3C3489; stroke: #AFA9EC; }
    .purple .th { fill: #EEEDFE; } .purple .ts { fill: #CECBF6; }
    .frame { stroke: #B4B2A9; }
    .label { fill: #B4B2A9; }
    .arr { stroke: #B4B2A9; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g class="gray">
  <rect x="110" y="30" width="240" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="230" y="52" text-anchor="middle" dominant-baseline="central">PR or push to main</text>
</g>
<g class="gray">
  <rect x="440" y="30" width="200" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="540" y="52" text-anchor="middle" dominant-baseline="central">Tag v*</text>
</g>
<line class="arr" x1="230" y1="74" x2="230" y2="98" marker-end="url(#arrow)"/>
<line class="arr" x1="540" y1="74" x2="540" y2="98" marker-end="url(#arrow)"/>

<rect class="frame" x="40" y="100" width="380" height="288" rx="12" stroke-width="0.5"/>
<text class="ts label" x="56" y="122">CI · pr-checks.yml</text>
<rect class="frame" x="440" y="100" width="200" height="116" rx="12" stroke-width="0.5"/>
<text class="ts label" x="456" y="122">CD · testflight.yml</text>

<g class="teal">
  <rect x="60" y="140" width="160" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="140" y="158" text-anchor="middle" dominant-baseline="central">guards · Ubuntu</text>
  <text class="ts" x="140" y="178" text-anchor="middle" dominant-baseline="central">check-*.sh, gitleaks</text>
</g>
<g class="gray">
  <rect x="240" y="140" width="160" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="320" y="158" text-anchor="middle" dominant-baseline="central">lint · Ubuntu</text>
  <text class="ts" x="320" y="178" text-anchor="middle" dominant-baseline="central">swiftlint --strict</text>
</g>
<line class="arr" x1="140" y1="196" x2="196" y2="223" marker-end="url(#arrow)"/>
<line class="arr" x1="320" y1="196" x2="264" y2="223" marker-end="url(#arrow)"/>
<g class="teal">
  <rect x="120" y="226" width="220" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="230" y="244" text-anchor="middle" dominant-baseline="central">build · Mac</text>
  <text class="ts" x="230" y="264" text-anchor="middle" dominant-baseline="central">build-strict.sh, zero warnings</text>
</g>
<line class="arr" x1="230" y1="282" x2="230" y2="308" marker-end="url(#arrow)"/>
<g class="purple">
  <rect x="120" y="312" width="220" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="230" y="330" text-anchor="middle" dominant-baseline="central">test · Mac</text>
  <text class="ts" x="230" y="350" text-anchor="middle" dominant-baseline="central">bundle exec fastlane test</text>
</g>

<g class="purple">
  <rect x="455" y="140" width="170" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="540" y="158" text-anchor="middle" dominant-baseline="central">fastlane beta</text>
  <text class="ts" x="540" y="178" text-anchor="middle" dominant-baseline="central">upload to TestFlight</text>
</g>
<g class="purple">
  <rect x="455" y="240" width="170" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="540" y="258" text-anchor="middle" dominant-baseline="central">fastlane release</text>
  <text class="ts" x="540" y="278" text-anchor="middle" dominant-baseline="central">by hand · App Store</text>
</g>

<g class="teal"><rect x="40" y="410" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="ts label" x="62" y="417" dominant-baseline="central">Bash script (Tools/CI)</text>
<g class="purple"><rect x="230" y="410" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="ts label" x="252" y="417" dominant-baseline="central">fastlane lane (Ruby)</text>
<g class="gray"><rect x="410" y="410" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="ts label" x="432" y="417" dominant-baseline="central">Trigger / other tool</text>
</svg>
